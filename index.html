<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171C;
    --bg-panel:#1B2029;
    --bg-panel-2:#232A35;
    --bg-input:#1A1F27;
    --border:#2E3540;
    --border-strong:#3A4250;
    --accent-amber:#F2A93B;
    --accent-blue:#4C8FC7;
    --accent-rust:#C1553B;
    --text:#E8EAED;
    --text-muted:#8A93A3;
    --text-faint:#5B6472;
    --ok:#4CAF7D;
    --warn:#F2A93B;
    --danger:#E2574C;
    --font-display:'Archivo', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  /* HEADER */
  .header{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--border-strong);
    padding-bottom:18px;margin-bottom:24px;flex-wrap:wrap;gap:12px;
  }
  .header .eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;
    color:var(--accent-amber);text-transform:uppercase;margin-bottom:4px;
  }
  .header h1{
    font-family:var(--font-display);font-weight:800;font-size:28px;
    margin:0;letter-spacing:-.01em;
  }
  .header .sub{color:var(--text-muted);font-size:13px;margin-top:4px;}
  .save-indicator{
    font-family:var(--font-mono);font-size:11px;color:var(--text-faint);
    display:flex;align-items:center;gap:6px;
  }
  .save-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);transition:background .2s;}
  .save-dot.saving{background:var(--accent-amber);}

  /* TABS */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto;}
  .tab-btn{
    font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;
    background:none;border:none;color:var(--text-muted);
    padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--accent-amber);border-bottom-color:var(--accent-amber);}

  .panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;padding:20px;}
  .panel h3{
    font-family:var(--font-display);font-size:15px;margin:0 0 4px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .panel .desc{color:var(--text-muted);font-size:12px;margin:0 0 18px;}

  /* SUMMARY BAR */
  .summary-bar{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border);border-radius:4px;overflow:hidden;}
  .summary-item{flex:1;padding:12px 16px;border-right:1px solid var(--border);}
  .summary-item:last-child{border-right:none;}
  .summary-item .label{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;}
  .summary-item .val{font-family:var(--font-mono);font-size:18px;font-weight:600;margin-top:4px;}
  .summary-item .val.ok{color:var(--ok);}
  .summary-item .val.warn{color:var(--warn);}
  .summary-item .val.danger{color:var(--danger);}

  /* CALENDAR */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-nav-btn{
    background:var(--bg-input);border:1px solid var(--border);color:var(--text);
    width:28px;height:28px;border-radius:3px;cursor:pointer;font-size:14px;
  }
  .cal-nav-btn:hover{border-color:var(--accent-amber);}
  .cal-month-label{font-family:var(--font-mono);font-size:13px;text-transform:capitalize;color:var(--text);}
  .legenda{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .legenda-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);}
  .legenda-dot{width:12px;height:12px;border-radius:50%;border:2px solid;}
  .func-input{
    background:var(--bg-input);border:1px solid var(--border);color:var(--text);
    font-size:12px;padding:4px 6px;border-radius:3px;width:130px;font-family:var(--font-body);
  }
  .func-input:focus{outline:none;border-color:var(--accent-amber);}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-dow{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-align:center;padding:4px 0;text-transform:uppercase;}
  .cal-cell{
    background:var(--bg-input);border:1px solid var(--border);border-radius:4px;
    min-height:74px;padding:6px;display:flex;flex-direction:column;gap:5px;
  }
  .cal-cell.empty{background:transparent;border:none;}
  .cal-daynum{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
  .stamp-row{display:flex;gap:4px;justify-content:center;margin-top:auto;}
  .stamp{
    width:20px;height:20px;border-radius:50%;
    border:2px dashed var(--border-strong);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:9px;color:var(--text-faint);
    cursor:pointer;background:none;transform:rotate(0deg);
    transition:transform .1s;position:relative;
  }
  .stamp:hover{border-color:var(--text-muted);}
  .stamp.on.f0{border-style:solid;border-color:var(--accent-amber);color:var(--accent-amber);background:rgba(242,169,59,.12);transform:rotate(-7deg);font-weight:600;}
  .stamp.on.f1{border-style:solid;border-color:var(--accent-blue);color:var(--accent-blue);background:rgba(76,143,199,.12);transform:rotate(5deg);font-weight:600;}
  .stamp.on.f2{border-style:solid;border-color:var(--accent-rust);color:var(--accent-rust);background:rgba(193,85,59,.12);transform:rotate(-4deg);font-weight:600;}
  .paid-toggle{
    position:absolute;top:-6px;right:-6px;width:13px;height:13px;border-radius:50%;
    background:var(--bg-input);border:1.5px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;
    font-size:8px;line-height:1;color:var(--text-faint);cursor:pointer;
  }
  .paid-toggle.paid{background:var(--ok);border-color:var(--ok);color:#0d1410;}
  .legenda-check{
    display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
    border-radius:50%;background:var(--ok);color:#0d1410;font-size:9px;
  }

  .totais-diarias{display:flex;gap:20px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .total-func{display:flex;align-items:center;gap:8px;font-size:13px;}
  .total-func .swatch{width:10px;height:10px;border-radius:50%;}
  .total-func b{font-family:var(--font-mono);}

  /* CALCULADORA DE PAGAMENTO */
  .calc-pagamento{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);}
  .calc-pagamento h4{font-family:var(--font-display);font-size:14px;margin:0 0 4px;}
  .calc-row{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
    padding:10px 0;border-bottom:1px solid var(--border);
  }
  .calc-nome{flex:1 1 150px;display:flex;align-items:center;gap:8px;font-size:13px;}
  .calc-nome .swatch{width:10px;height:10px;border-radius:50%;flex:none;}
  .calc-qtd{flex:1 1 210px;font-family:var(--font-mono);font-size:12px;color:var(--text-muted);}
  .calc-qtd b{color:var(--warn);}
  .calc-valor-diaria{width:110px;flex:none;}
  .calc-subtotal{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--accent-amber);flex:none;min-width:90px;text-align:right;}
  .mark-paid-btn{
    font-family:var(--font-mono);font-size:11px;background:none;
    border:1px solid var(--border-strong);color:var(--text-muted);
    padding:7px 10px;border-radius:3px;cursor:pointer;flex:none;white-space:nowrap;
  }
  .mark-paid-btn:hover:not(:disabled){border-color:var(--ok);color:var(--ok);}
  .mark-paid-btn:disabled{opacity:.35;cursor:default;}
  .calc-total{
    margin-top:14px;font-family:var(--font-mono);font-size:14px;color:var(--text);
    display:flex;justify-content:flex-end;gap:8px;
  }
  .calc-total b{color:var(--ok);font-size:16px;}

  /* HISTÓRICO DE PAGAMENTOS */
  .historico-pagamentos{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
  .historico-pagamentos h4{font-family:var(--font-display);font-size:14px;margin:0 0 10px;}
  .historico-table td.mono-cell{font-family:var(--font-mono);}

  /* LISTA DE COMPRA (adicionar vários materiais de uma vez) */
  .lista-compra{
    margin-top:16px;padding:14px 16px;border:1px dashed var(--border-strong);border-radius:4px;background:var(--bg-input);
  }
  .lista-compra h4{font-family:var(--font-display);font-size:13px;margin:0 0 4px;}
  .lista-compra textarea{
    width:100%;min-height:80px;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);
    font-family:var(--font-body);font-size:13px;padding:8px;border-radius:3px;resize:vertical;margin-top:8px;
  }
  .lista-compra textarea:focus{outline:none;border-color:var(--accent-amber);}

  /* TABLES */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.06em;padding:8px 8px;border-bottom:1px solid var(--border-strong);
  }
  tbody td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:hover{background:var(--bg-panel-2);}
  .cell-input{
    width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text);
    padding:6px 8px;border-radius:3px;font-family:var(--font-body);font-size:13px;
  }
  .cell-input:focus{outline:none;border-color:var(--accent-amber);}
  .cell-input.mono{font-family:var(--font-mono);}
  select.cell-input{cursor:pointer;}
  .badge{
    font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:10px;
    display:inline-block;white-space:nowrap;
  }
  .badge.ok{background:rgba(76,175,125,.15);color:var(--ok);}
  .badge.warn{background:rgba(242,169,59,.15);color:var(--warn);}
  .badge.danger{background:rgba(226,87,76,.15);color:var(--danger);}
  .icon-btn{
    background:none;border:1px solid var(--border);color:var(--text-muted);
    width:28px;height:28px;border-radius:3px;cursor:pointer;font-size:13px;
  }
  .icon-btn:hover{border-color:var(--danger);color:var(--danger);}
  .add-btn{
    font-family:var(--font-mono);font-size:12px;background:none;
    border:1px dashed var(--border-strong);color:var(--text-muted);
    padding:8px 14px;border-radius:4px;cursor:pointer;margin-top:12px;width:100%;
  }
  .add-btn:hover{border-color:var(--accent-amber);color:var(--accent-amber);}
  .table-wrap{overflow-x:auto;}

  /* FATURAMENTO */
  .fat-top{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .fat-card{flex:1;min-width:160px;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;padding:14px 16px;}
  .fat-card .label{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
  .fat-card input{
    background:none;border:none;color:var(--text);font-family:var(--font-mono);
    font-size:18px;font-weight:600;width:100%;padding:0;
  }
  .fat-card input:focus{outline:none;}
  .fat-card .val-display{font-family:var(--font-mono);font-size:18px;font-weight:600;}
  .fat-card.saldo .val-display.ok{color:var(--ok);}
  .fat-card.saldo .val-display.danger{color:var(--danger);}

  ::placeholder{color:var(--text-faint);}
  @media (max-width:640px){
    .cal-cell{min-height:60px;}
    .stamp{width:17px;height:17px;font-size:8px;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const STORAGE_KEY = 'painel-obras-state-v1';
// Senha para liberar edição. Quem não souber a senha só visualiza.
const EDITOR_PASSWORD = 'gil123';
const EDITOR_KEY = 'painel-obras-editor-unlocked';
let isEditor = false;
try{ isEditor = localStorage.getItem(EDITOR_KEY) === '1'; }catch(e){ /* ignore */ }

function tryUnlockEditor(){
  const senha = window.prompt('Digite a senha para editar o painel:');
  if(senha === null) return;
  if(senha === EDITOR_PASSWORD){
    isEditor = true;
    try{ localStorage.setItem(EDITOR_KEY, '1'); }catch(e){ /* ignore */ }
    render();
  }else{
    alert('Senha incorreta.');
  }
}

function lockEditor(){
  isEditor = false;
  try{ localStorage.removeItem(EDITOR_KEY); }catch(e){ /* ignore */ }
  render();
}

// Filtros de data usados na visualização de Materiais e Locações
let filtros = { materiaisDe:'', materiaisAte:'', locacoesDe:'', locacoesAte:'' };
// Link da pasta no Google Drive com todas as NFs desta obra.
const PASTA_NFS_URL = 'https://drive.google.com/drive/folders/1vhYbl3PFmstrYS0c6DJWSB4yhIXHm9Jx?usp=sharing';
// URL do Web App do Google Apps Script (termina em /exec).
// É esse endpoint que faz os dados aparecerem iguais em qualquer computador.
const SHEETS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz_HZmaQx4L-9f4c8cyvUCkic2PjbMW4YO6v5Cp8lh-q5JQtOZQVRcGUJhZIDCpgFra8A/exec';

function syncToSheets(stateToSync){
  if(!SHEETS_WEBAPP_URL) return;
  try{
    fetch(SHEETS_WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(stateToSync)
    }).catch(function(e){ console.warn('Falha ao sincronizar com a planilha', e); });
  }catch(e){ console.warn('Falha ao sincronizar com a planilha', e); }
}

const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOWS = ['dom','seg','ter','qua','qui','sex','sáb'];
const today = new Date();
const todayISO = today.toISOString().slice(0,10);
const currentYM = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0');

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function defaultObra(nome, opts){
  opts = opts || {};
  const o = {
    nome,
    materiais: [],
    locacoes: [],
    faturamento: { contratado: 0, medicoes: [] }
  };
  if(opts.comDiarias){
    o.funcionarios = ['Funcionário 1','Funcionário 2','Funcionário 3'];
    o.viewMonth = currentYM;
    o.diarias = {};
    o.valorDiaria = [0,0,0];
    o.pagamentos = {};
    o.historicoPagamentos = [];
  }
  if(opts.comInventario) o.inventario = [];
  return o;
}

function defaultState(){
  return {
    activeObra: 'casaGil',
    activeTab: { casaGil: 'diarias' },
    obras: {
      casaGil: defaultObra('Casa Gil - Grotão', { comDiarias: true })
    }
  };
}

function migrateState(s){
  // Remove qualquer obra antiga (ex.: Igreja Plena) que tenha ficado salva
  if(s.obras){
    Object.keys(s.obras).forEach(k=>{
      if(k !== 'casaGil') delete s.obras[k];
    });
    if(s.activeTab) Object.keys(s.activeTab).forEach(k=>{
      if(k !== 'casaGil') delete s.activeTab[k];
    });
  }
  if(!s.obras || !s.obras.casaGil){
    s.obras = { casaGil: defaultObra('Casa Gil - Grotão', { comDiarias: true }) };
  }
  s.activeObra = 'casaGil';
  if(!s.activeTab) s.activeTab = {};
  if(!s.activeTab.casaGil) s.activeTab.casaGil = 'diarias';

  const cg = s.obras.casaGil;
  if(cg && cg.diarias !== undefined){
    if(cg.valorDiaria === undefined) cg.valorDiaria = [0,0,0];
    if(cg.pagamentos === undefined) cg.pagamentos = {};
    if(cg.historicoPagamentos === undefined) cg.historicoPagamentos = [];
  }
  return s;
}

let state = null;
let saveTimeout = null;

async function loadState(){
  let loaded = null;

  if(SHEETS_WEBAPP_URL){
    try{
      const resp = await fetch(SHEETS_WEBAPP_URL, { method: 'GET' });
      if(resp.ok){
        const data = await resp.json();
        if(data && data.obras) loaded = data;
      }
    }catch(e){
      console.warn('Não foi possível carregar da planilha, tentando backup local', e);
    }
  }

  if(loaded === null){
    try{
      if(window.storage){
        const r = await window.storage.get(STORAGE_KEY, false);
        loaded = r ? JSON.parse(r.value) : null;
      }
    }catch(e){ /* ignore, tenta próximo fallback */ }
  }

  if(loaded === null){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      loaded = raw ? JSON.parse(raw) : null;
    }catch(e){ /* ignore */ }
  }

  state = loaded || defaultState();
  state = migrateState(state);
  render();
}

function persist(){
  const dot = document.getElementById('save-dot');
  if(dot) dot.classList.add('saving');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async ()=>{
    const json = JSON.stringify(state);
    try{
      if(window.storage){
        await window.storage.set(STORAGE_KEY, json, false);
      }
    }catch(e){
      console.warn('Falha ao salvar no armazenamento do Claude, usando backup local por enquanto', e);
    }
    try{
      localStorage.setItem(STORAGE_KEY, json);
    }catch(e){ /* ignore */ }
    syncToSheets(state);
    if(dot) dot.classList.remove('saving');
  }, 400);
}

function fmtBRL(n){
  n = Number(n) || 0;
  return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}

function formatMes(mk){
  const [y,m] = mk.split('-').map(Number);
  return MESES[m-1] + ' de ' + y;
}

function tabsForObra(key){
  const o = state.obras[key];
  const tabs = [];
  if(o.diarias !== undefined) tabs.push('diarias');
  tabs.push('materiais','locacoes');
  if(o.inventario !== undefined) tabs.push('inventario');
  tabs.push('resumo');
  return tabs;
}

const TAB_LABELS = {
  diarias: '📅 Diárias',
  materiais: '🧾 Materiais',
  locacoes: '🔧 Locações',
  inventario: '📦 Inventário / Almoxarifado',
  resumo: '📊 Resumo Geral'
};

/* ---------- RENDER ROOT ---------- */
function render(){
  const app = document.getElementById('app');
  const activeKey = state.activeObra;
  const obra = state.obras[activeKey];
  const validTabs = tabsForObra(activeKey);
  if(!validTabs.includes(state.activeTab[activeKey])){
    state.activeTab[activeKey] = validTabs[0];
  }

  app.innerHTML = `
    <div class="header">
      <div>
        <div class="eyebrow">Canteiro // Gestão de obras</div>
        <h1>Painel de Obras — Casa Gil</h1>
        <div class="sub">Controle de diárias, materiais, locações e resumo geral</div>
      </div>
      <div class="save-indicator">
        <span class="save-dot" id="save-dot"></span> salvo automaticamente${SHEETS_WEBAPP_URL ? ' · <span style="color:var(--ok)">🔗 sincronizado entre computadores</span>' : ''}
        · ${isEditor
          ? `<span style="color:var(--ok)">🔓 modo editor</span> <button data-action="lock-editor" style="background:none;border:1px solid var(--border-strong);color:var(--text-muted);font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:3px;cursor:pointer;margin-left:6px;">sair</button>`
          : `<button data-action="unlock-editor" style="background:none;border:1px solid var(--border-strong);color:var(--text-muted);font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:3px;cursor:pointer;">🔒 entrar como editor</button>`}
      </div>
    </div>

    <div class="tabs">
      ${tabsForObra(activeKey).map(t => `
        <button class="tab-btn ${state.activeTab[activeKey]===t?'active':''}" data-action="tab" data-tab="${t}">${TAB_LABELS[t]}</button>
      `).join('')}
    </div>

    <div id="tab-content"></div>
  `;

  renderTabContent();
  bindGlobalEvents();
}

function sumMedicoes(o){
  return (o.faturamento.medicoes||[]).reduce((s,m)=> s + (Number(m.valor)||0), 0);
}

function renderTabContent(){
  const key = state.activeObra;
  const tab = state.activeTab[key];
  const el = document.getElementById('tab-content');
  if(tab === 'diarias') el.innerHTML = renderDiarias(key);
  else if(tab === 'materiais') el.innerHTML = renderMateriais(key);
  else if(tab === 'locacoes') el.innerHTML = renderLocacoes(key);
  else if(tab === 'inventario') el.innerHTML = renderInventario(key);
  else if(tab === 'resumo') el.innerHTML = renderResumo(key);
  bindTabEvents();
}

/* ---------- DIÁRIAS ---------- */
function renderDiarias(key){
  const o = state.obras[key];
  const [y,m] = o.viewMonth.split('-').map(Number);
  const monthIdx = m-1;
  const monthKey = o.viewMonth;
  const diasNoMes = new Date(y, monthIdx+1, 0).getDate();
  const startDow = new Date(y, monthIdx, 1).getDay();
  const diariasMes = o.diarias[monthKey] || {};
  const pagamentosMes = o.pagamentos[monthKey] || {};

  const totals = [0,0,0];
  const paidCounts = [0,0,0];
  Object.keys(diariasMes).forEach(dayStr=>{
    const dayObj = diariasMes[dayStr];
    [0,1,2].forEach(fi=>{
      if(dayObj[fi]){
        totals[fi]++;
        if(pagamentosMes[dayStr] && pagamentosMes[dayStr][fi]) paidCounts[fi]++;
      }
    });
  });
  const pendentes = [0,1,2].map(fi => totals[fi] - paidCounts[fi]);

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=diasNoMes; d++){
    const dayObj = diariasMes[d] || {};
    const pagoDia = pagamentosMes[d] || {};
    const stamps = [0,1,2].map(fi => {
      const worked = !!dayObj[fi];
      const paid = worked && !!pagoDia[fi];
      const initial = o.funcionarios[fi] ? o.funcionarios[fi].trim().charAt(0).toUpperCase() : (fi+1);
      if(isEditor){
        return `
          <button class="stamp ${worked?'on f'+fi:''}" data-action="toggle-day" data-day="${d}" data-func="${fi}" title="${o.funcionarios[fi]}">
            ${initial}
            ${worked ? `<span class="paid-toggle ${paid?'paid':''}" data-action="toggle-paid" data-day="${d}" data-func="${fi}" title="${paid?'Pago — clique para desmarcar':'Marcar diária como paga'}">✓</span>` : ''}
          </button>
        `;
      }
      return `
        <span class="stamp ${worked?'on f'+fi:''}" style="cursor:default;" title="${o.funcionarios[fi]}">
          ${initial}
          ${worked && paid ? `<span class="paid-toggle paid" style="cursor:default;">✓</span>` : ''}
        </span>
      `;
    }).join('');
    cells += `
      <div class="cal-cell">
        <div class="cal-daynum">${d}</div>
        <div class="stamp-row">${stamps}</div>
      </div>
    `;
  }

  const colorVar = ['var(--accent-amber)','var(--accent-blue)','var(--accent-rust)'];

  const totalGeralPendente = pendentes.reduce((s,p,fi)=> s + p*(Number(o.valorDiaria[fi])||0), 0);

  const historico = o.historicoPagamentos || [];

  return `
    <div class="panel">
      <h3>Diárias — ${o.nome}</h3>
      <p class="desc">${isEditor ? 'Clique no carimbo para marcar presença. O ✓ no canto marca se aquela diária já foi paga.' : 'Acompanhamento de presença e pagamentos dos funcionários.'}</p>

      <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
        ${[0,1,2].map(fi => isEditor ? `
          <input class="func-input" data-action="edit-func" data-func="${fi}" value="${o.funcionarios[fi]}" placeholder="Nome do funcionário ${fi+1}">
        ` : `
          <span class="func-input" style="display:inline-flex;align-items:center;">${escAttr(o.funcionarios[fi])}</span>
        `).join('')}
      </div>

      <div class="cal-header">
        <button class="cal-nav-btn" data-action="cal-prev">‹</button>
        <div class="cal-month-label">${MESES[monthIdx]} de ${y}</div>
        <button class="cal-nav-btn" data-action="cal-next">›</button>
      </div>

      <div class="legenda">
        ${[0,1,2].map(fi => `
          <div class="legenda-item"><span class="legenda-dot" style="border-color:${colorVar[fi]}"></span>${o.funcionarios[fi]}</div>
        `).join('')}
        <div class="legenda-item"><span class="legenda-check">✓</span> diária já paga</div>
      </div>

      <div class="cal-grid">
        ${DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>

      <div class="totais-diarias">
        ${[0,1,2].map(fi => `
          <div class="total-func">
            <span class="swatch" style="background:${colorVar[fi]}"></span>
            ${o.funcionarios[fi]}: <b>${totals[fi]}</b> diária(s) — <b style="color:var(--ok)">${paidCounts[fi]}</b> paga(s) — <b style="color:var(--warn)">${pendentes[fi]}</b> pendente(s)
          </div>
        `).join('')}
      </div>

      ${isEditor ? `
      <div class="calc-pagamento">
        <h4>Calculadora de pagamento — ${MESES[monthIdx]}</h4>
        <p class="desc">O valor considera apenas as diárias ainda não pagas, para não contar duas vezes.</p>
        ${[0,1,2].map(fi => `
          <div class="calc-row">
            <span class="calc-nome"><span class="swatch" style="background:${colorVar[fi]}"></span>${o.funcionarios[fi]}</span>
            <span class="calc-qtd">${totals[fi]} trab. · ${paidCounts[fi]} pagas · <b>${pendentes[fi]} pendentes</b></span>
            <input type="number" step="0.01" class="cell-input mono calc-valor-diaria" data-func="${fi}" value="${o.valorDiaria[fi]||''}" placeholder="valor/diária">
            <span class="calc-subtotal" data-func-subtotal="${fi}">${fmtBRL(pendentes[fi]*(Number(o.valorDiaria[fi])||0))}</span>
            <button class="mark-paid-btn" data-action="marcar-pagas" data-func="${fi}" ${pendentes[fi]===0?'disabled':''}>marcar pendentes como pagas</button>
          </div>
        `).join('')}
        <div class="calc-total">Total a pagar (pendente) no mês: <b id="calc-total-geral">${fmtBRL(totalGeralPendente)}</b></div>
      </div>
      ` : ''}

      <div class="historico-pagamentos">
        <h4>Histórico de pagamentos</h4>
        ${historico.length ? `
          <div class="table-wrap">
          <table class="historico-table">
            <thead><tr><th>Funcionário</th><th>Mês</th><th>Dias</th><th>Valor</th><th>Registrado em</th>${isEditor?'<th></th>':''}</tr></thead>
            <tbody>
              ${historico.map(h => `
                <tr data-id="${h.id}">
                  <td>${escAttr(h.funcionario)}</td>
                  <td>${formatMes(h.mes)}</td>
                  <td class="mono-cell">${h.dias}</td>
                  <td class="mono-cell">${fmtBRL(h.valor)}</td>
                  <td class="mono-cell">${h.data}</td>
                  ${isEditor ? `<td><button class="icon-btn" data-action="del-historico">✕</button></td>` : ''}
                </tr>
              `).join('')}
            </tbody>
          </table>
          </div>
        ` : `<p class="desc" style="margin:0;">Nenhum pagamento registrado ainda.</p>`}
      </div>
    </div>
  `;
}

/* ---------- MATERIAIS ---------- */
function materialStatus(item){
  if(item.pago) return {label:'Pago', cls:'ok'};
  if(item.vencimento && item.vencimento < todayISO) return {label:'Vencido', cls:'danger'};
  return {label:'Pendente', cls:'warn'};
}

function renderMateriais(key){
  const o = state.obras[key];
  const allItems = o.materiais || [];
  const items = allItems.filter(i => {
    if(filtros.materiaisDe && (!i.vencimento || i.vencimento < filtros.materiaisDe)) return false;
    if(filtros.materiaisAte && (!i.vencimento || i.vencimento > filtros.materiaisAte)) return false;
    return true;
  });
  const pendCount = items.filter(i=>!i.pago && !(i.vencimento && i.vencimento<todayISO)).length;
  const vencCount = items.filter(i=>!i.pago && i.vencimento && i.vencimento<todayISO).length;
  const totalValor = items.reduce((s,i)=>s+(Number(i.valor)||0),0);

  const filtroAtivo = filtros.materiaisDe || filtros.materiaisAte;

  const linhaEditor = (item) => `
    <tr data-id="${item.id}">
      <td><input class="cell-input" data-field="nome" value="${escAttr(item.nome)}" placeholder="Ex.: Cimento CP-II 50kg"></td>
      <td><input class="cell-input" data-field="fornecedor" value="${escAttr(item.fornecedor)}" placeholder="Nome do fornecedor"></td>
      <td><input class="cell-input mono" data-field="valor" type="number" step="0.01" value="${item.valor||''}" placeholder="0,00"></td>
      <td><input class="cell-input mono" data-field="nf" value="${escAttr(item.nf)}" placeholder="000123"></td>
      <td>
        <div style="display:flex;gap:4px;align-items:center;">
          <input class="cell-input" data-field="nfLink" value="${escAttr(item.nfLink)}" placeholder="Colar link do Drive" style="font-size:11px;">
          ${item.nfLink ? `<a href="${escAttr(item.nfLink)}" target="_blank" rel="noopener" title="Abrir NF" style="flex:none;text-decoration:none;font-size:14px;">📎</a>` : ''}
        </div>
      </td>
      <td><input class="cell-input mono" data-field="vencimento" type="date" value="${item.vencimento||''}"></td>
      <td>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);">
          <input type="checkbox" data-field="pago" ${item.pago?'checked':''}> pago
        </label>
        <span class="badge ${materialStatus(item).cls}" style="margin-top:4px;display:inline-block;">${materialStatus(item).label}</span>
      </td>
      <td><button class="icon-btn" data-action="del-material">✕</button></td>
    </tr>
  `;

  const linhaLeitor = (item) => `
    <tr data-id="${item.id}">
      <td>${escAttr(item.nome) || '<span style="color:var(--text-faint)">—</span>'}</td>
      <td>${escAttr(item.fornecedor) || '<span style="color:var(--text-faint)">—</span>'}</td>
      <td class="mono-cell">${fmtBRL(item.valor)}</td>
      <td class="mono-cell">${escAttr(item.nf) || '<span style="color:var(--text-faint)">—</span>'}</td>
      <td>${item.nfLink ? `<a href="${escAttr(item.nfLink)}" target="_blank" rel="noopener" style="color:var(--accent-amber);">📎 Ver NF</a>` : '<span style="color:var(--text-faint)">—</span>'}</td>
      <td class="mono-cell">${item.vencimento ? item.vencimento.split('-').reverse().join('/') : '<span style="color:var(--text-faint)">—</span>'}</td>
      <td><span class="badge ${materialStatus(item).cls}">${materialStatus(item).label}</span></td>
    </tr>
  `;

  return `
    <div class="panel">
      <h3>Materiais comprados — ${o.nome}</h3>
      <p class="desc">${isEditor ? 'Registre material, valor, número da nota fiscal e vencimento do boleto.' : 'Acompanhamento dos materiais comprados nesta obra.'}</p>
      <p class="desc" style="margin-top:-14px;">
        📁 <a href="${PASTA_NFS_URL}" target="_blank" rel="noopener" style="color:var(--accent-amber);">Abrir pasta de NFs desta obra no Google Drive</a>
      </p>

      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;padding:12px;border:1px solid var(--border);border-radius:4px;background:var(--bg-input);">
        <div>
          <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;margin-bottom:4px;">Filtrar vencimento de</div>
          <input class="cell-input mono" type="date" id="filtro-materiais-de" value="${filtros.materiaisDe}" style="width:150px;">
        </div>
        <div>
          <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;margin-bottom:4px;">até</div>
          <input class="cell-input mono" type="date" id="filtro-materiais-ate" value="${filtros.materiaisAte}" style="width:150px;">
        </div>
        ${filtroAtivo ? `<button class="mark-paid-btn" data-action="limpar-filtro-materiais">limpar filtro</button>` : ''}
      </div>

      <div class="summary-bar">
        <div class="summary-item"><div class="label">Total investido${filtroAtivo?' (filtrado)':''}</div><div class="val">${fmtBRL(totalValor)}</div></div>
        <div class="summary-item"><div class="label">Pendentes</div><div class="val warn">${pendCount}</div></div>
        <div class="summary-item"><div class="label">Vencidos</div><div class="val danger">${vencCount}</div></div>
      </div>

      <div class="table-wrap">
      <table>
        <thead><tr>
          ${isEditor ? `
          <th style="width:17%">Material</th>
          <th style="width:13%">Fornecedor</th>
          <th style="width:9%">Valor</th>
          <th style="width:9%">Nº NF</th>
          <th style="width:15%">NF (link do Drive)</th>
          <th style="width:12%">Venc. boleto</th>
          <th style="width:12%">Status</th>
          <th style="width:5%"></th>
          ` : `
          <th style="width:20%">Material</th>
          <th style="width:15%">Fornecedor</th>
          <th style="width:11%">Valor</th>
          <th style="width:10%">Nº NF</th>
          <th style="width:14%">NF</th>
          <th style="width:14%">Venc. boleto</th>
          <th style="width:16%">Status</th>
          `}
        </tr></thead>
        <tbody>
          ${items.map(item => isEditor ? linhaEditor(item) : linhaLeitor(item)).join('')}
        </tbody>
      </table>
      </div>
      ${items.length===0 ? `<p class="desc" style="margin-top:12px;">Nenhum material encontrado${filtroAtivo?' para esse período':''}.</p>` : ''}

      ${isEditor ? `
      <button class="add-btn" data-action="add-material">+ adicionar material</button>

      <div style="margin-top:10px;font-size:12px;color:var(--text-faint);">
        💡 Dica: crie uma pasta no Google Drive só para as NFs dessa obra, suba os arquivos lá, clique com o botão direito → Compartilhar → Copiar link, e cole na coluna "NF (link do Drive)" de cada material.
      </div>

      <div class="lista-compra">
        <h4>📋 Lista de compra — adicionar vários materiais de uma vez</h4>
        <p class="desc" style="margin-bottom:0;">Digite um material por linha e adicione a lista inteira. Depois é só preencher valor, NF e vencimento de cada um.</p>
        <textarea id="lista-compra-texto" placeholder="Ex.:&#10;Cimento CP-II 50kg&#10;Areia média (m³)&#10;Tijolo baiano&#10;Vergalhão 3/8"></textarea>
        <button class="add-btn" data-action="add-lista-compra">+ adicionar lista completa</button>
      </div>
      ` : ''}
    </div>
  `;
}

/* ---------- LOCAÇÕES ---------- */
function renderLocacoes(key){
  const o = state.obras[key];
  const allItems = o.locacoes || [];
  const items = allItems.filter(i => {
    if(filtros.locacoesDe && (!i.inicio || i.inicio < filtros.locacoesDe)) return false;
    if(filtros.locacoesAte && (!i.inicio || i.inicio > filtros.locacoesAte)) return false;
    return true;
  });
  const totalValor = items.reduce((s,i)=>s+(Number(i.valor)||0),0);
  const filtroAtivo = filtros.locacoesDe || filtros.locacoesAte;

  const linhaEditor = (item) => `
    <tr data-id="${item.id}">

      <td><input class="cell-input" data-field="fornecedor" value="${escAttr(item.fornecedor)}" placeholder="Nome do fornecedor"></td>

      <td><input class="cell-input mono" data-field="fim" type="date" value="${item.fim||''}"></td>

      <td>
        <div style="display:flex;gap:4px;align-items:center;">
          <input class="cell-input" data-field="nfLink" value="${escAttr(item.nfLink)}" placeholder="Colar link do Drive" style="font-size:11px;">
          ${item.nfLink ? `<a href="${escAttr(item.nfLink)}" target="_blank" rel="noopener" title="Abrir NF" style="flex:none;text-decoration:none;font-size:14px;">📎</a>` : ''}
        </div>
      </td>
      <td>
        <select class="cell-input" data-field="status">
          ${['Pendente','Ativa','Concluída'].map(s=>`<option value="${s}" ${item.status===s?'selected':''}>${s}</option>`).join('')}

        </div>
      </td>
      <td><button class="icon-btn" data-action="del-locacao">✕</button></td>
    </tr>

  const linhaLeitor = (item) => `
    <tr data-id="${item.id}">
      <td>${escAttr(item.equipamento) || '<span style="color:var(--text-faint)">—</span>'}</td>

      <td><span class="badge ${item.status==='Ativa'?'ok':(item.status==='Concluída'?'warn':'danger')}">${escAttr(item.status)||'—'}</span></td>

    </tr>

  return `

      <h3>Locações necessárias — ${o.nome}</h3>

      </div>

      <div class="table-wrap">
      <table>
        <thead><tr>
          ${isEditor ? `
          <th style="width:16%">Equipamento / Serviço</th>
          <th style="width:13%">Fornecedor</th>
          <th style="width:10%">Início</th>
          <th style="width:10%">Fim</th>
          <th style="width:10%">Valor</th>
          <th style="width:14%">NF (link do Drive)</th>
          <th style="width:10%">Status</th>
          <th style="width:12%">Renovada</th>
          <th style="width:5%"></th>
          ` : `
          <th style="width:18%">Equipamento / Serviço</th>
          <th style="width:15%">Fornecedor</th>
          <th style="width:11%">Início</th>
          <th style="width:11%">Fim</th>
          <th style="width:10%">Valor</th>
          <th style="width:12%">NF</th>
          <th style="width:11%">Status</th>
          <th style="width:12%">Renovada</th>
          `}
        </tr></thead>
        <tbody>
          ${items.map(item => isEditor ? linhaEditor(item) : linhaLeitor(item)).join('')}
        </tbody>
      </table>
      </div>
      ${items.length===0 ? `<p class="desc" style="margin-top:12px;">Nenhuma locação encontrada${filtroAtivo?' para esse período':''}.</p>` : ''}
      ${isEditor ? `<button class="add-btn" data-action="add-locacao">+ adicionar locação</button>` : ''}
    </div>
  `;
}

/* ---------- FATURAMENTO ---------- */
function renderFaturamento(key){
  const o = state.obras[key];
  const f = o.faturamento;
  const faturado = sumMedicoes(o);
  const saldo = (Number(f.contratado)||0) - faturado;

  return `
    <div class="panel">
      <h3>Faturamento — ${o.nome}</h3>
      <p class="desc">Valor contratado, medições faturadas e saldo restante.</p>

      <div class="fat-top">
        <div class="fat-card">
          <div class="label">Valor contratado</div>
          <input type="number" step="0.01" id="input-contratado" value="${f.contratado||''}" placeholder="0,00">
        </div>
        <div class="fat-card">
          <div class="label">Valor faturado</div>
          <div class="val-display">${fmtBRL(faturado)}</div>
        </div>
        <div class="fat-card saldo">
          <div class="label">Saldo a faturar</div>
          <div class="val-display ${saldo<0?'danger':'ok'}">${fmtBRL(saldo)}</div>
        </div>
      </div>

      <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:20%">Data da medição</th>
          <th style="width:44%">Descrição</th>
          <th style="width:26%">Valor faturado</th>
          <th style="width:10%"></th>
        </tr></thead>
        <tbody>
          ${(f.medicoes||[]).map(item => `
            <tr data-id="${item.id}">
              <td><input class="cell-input mono" data-field="data" type="date" value="${item.data||''}"></td>
              <td><input class="cell-input" data-field="descricao" value="${escAttr(item.descricao)}" placeholder="Ex.: 1ª medição"></td>
              <td><input class="cell-input mono" data-field="valor" type="number" step="0.01" value="${item.valor||''}" placeholder="0,00"></td>
              <td><button class="icon-btn" data-action="del-medicao">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
      <button class="add-btn" data-action="add-medicao">+ adicionar medição</button>
    </div>
  `;
}

/* ---------- INVENTÁRIO (Igreja Plena) ---------- */
function renderInventario(key){
  const o = state.obras[key];
  const items = o.inventario || [];

  return `
    <div class="panel">
      <h3>Inventário / Almoxarifado — ${o.nome}</h3>
      <p class="desc">Materiais que já estão em obra, aguardando aplicação.</p>

      <div class="summary-bar">
        <div class="summary-item"><div class="label">Itens no almoxarifado</div><div class="val">${items.length}</div></div>
      </div>

      <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:24%">Material</th>
          <th style="width:12%">Qtd.</th>
          <th style="width:12%">Unidade</th>
          <th style="width:20%">Localização</th>
          <th style="width:14%">Entrada</th>
          <th style="width:14%">Observações</th>
          <th style="width:4%"></th>
        </tr></thead>
        <tbody>
          ${items.map(item => `
            <tr data-id="${item.id}">
              <td><input class="cell-input" data-field="material" value="${escAttr(item.material)}" placeholder="Ex.: Tijolo baiano"></td>
              <td><input class="cell-input mono" data-field="quantidade" type="number" step="0.01" value="${item.quantidade||''}"></td>
              <td><input class="cell-input" data-field="unidade" value="${escAttr(item.unidade)}" placeholder="un, m³, kg..."></td>
              <td><input class="cell-input" data-field="localizacao" value="${escAttr(item.localizacao)}" placeholder="Ex.: Depósito, 2º andar"></td>
              <td><input class="cell-input mono" data-field="dataEntrada" type="date" value="${item.dataEntrada||''}"></td>
              <td><input class="cell-input" data-field="obs" value="${escAttr(item.obs)}" placeholder="opcional"></td>
              <td><button class="icon-btn" data-action="del-inventario">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
      <button class="add-btn" data-action="add-inventario">+ adicionar item ao inventário</button>
    </div>
  `;
}

/* ---------- RESUMO GERAL ---------- */
function calcularDiariasPagas(o){
  if(o.diarias === undefined) return 0;
  let total = 0;
  const valorDiaria = o.valorDiaria || [0,0,0];
  Object.keys(o.diarias || {}).forEach(mk => {
    const diasMes = o.diarias[mk] || {};
    const pagamentosMes = (o.pagamentos && o.pagamentos[mk]) || {};
    Object.keys(diasMes).forEach(dayStr => {
      const dayObj = diasMes[dayStr] || {};
      const pagoDia = pagamentosMes[dayStr] || {};
      [0,1,2].forEach(fi => {
        if(dayObj[fi] && pagoDia[fi]){
          total += Number(valorDiaria[fi]) || 0;
        }
      });
    });
  });
  return total;
}

function renderResumo(key){
  const o = state.obras[key];

  const somaMateriais = (o.materiais||[]).reduce((s,i)=>s+(Number(i.valor)||0),0);
  const somaLocacoes = (o.locacoes||[]).reduce((s,i)=>s+(Number(i.valor)||0),0);
  const somaDiariasPagas = calcularDiariasPagas(o);
  const totalRealizado = somaMateriais + somaLocacoes + somaDiariasPagas;

  return `
    <div class="panel">
      <h3>Resumo Geral — ${o.nome}</h3>
      <p class="desc">Somatório de tudo que já foi efetivamente gasto na obra até agora.</p>

      <div class="summary-bar">
        <div class="summary-item"><div class="label">Materiais</div><div class="val">${fmtBRL(somaMateriais)}</div></div>
        <div class="summary-item"><div class="label">Locações</div><div class="val">${fmtBRL(somaLocacoes)}</div></div>
        <div class="summary-item"><div class="label">Diárias pagas</div><div class="val">${fmtBRL(somaDiariasPagas)}</div></div>
        <div class="summary-item"><div class="label">Total já realizado</div><div class="val" style="color:var(--accent-amber);font-size:22px;">${fmtBRL(totalRealizado)}</div></div>
      </div>

      <div class="calc-pagamento">
        <h4>Como esse total é calculado</h4>
        <p class="desc">
          Total já realizado = Materiais (${fmtBRL(somaMateriais)}) + Locações (${fmtBRL(somaLocacoes)}) + Diárias já pagas (${fmtBRL(somaDiariasPagas)}).
          <br>Esse valor representa o custo real que já saiu do caixa da obra até agora.
        </p>
      </div>
    </div>
  `;
}

function escAttr(v){
  if(v===undefined || v===null) return '';
  return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

/* ---------- EVENTS ---------- */
function bindGlobalEvents(){
  const unlockBtn = document.querySelector('[data-action="unlock-editor"]');
  if(unlockBtn) unlockBtn.addEventListener('click', tryUnlockEditor);
  const lockBtn = document.querySelector('[data-action="lock-editor"]');
  if(lockBtn) lockBtn.addEventListener('click', lockEditor);
  document.querySelectorAll('[data-action="tab"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.activeTab[state.activeObra] = el.dataset.tab;
      render();
    });
  });
}

function bindTabEvents(){
  const key = state.activeObra;
  const o = state.obras[key];
  const tab = state.activeTab[key];
  const content = document.getElementById('tab-content');
  if(!content) return;

  if(tab === 'diarias'){
    content.querySelectorAll('[data-action="toggle-day"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const day = Number(btn.dataset.day);
        const fi = Number(btn.dataset.func);
        const mk = o.viewMonth;
        if(!o.diarias[mk]) o.diarias[mk] = {};
        if(!o.diarias[mk][day]) o.diarias[mk][day] = {};
        o.diarias[mk][day][fi] = !o.diarias[mk][day][fi];
        // se desmarcar o dia trabalhado, o pagamento daquele dia também é limpo
        if(!o.diarias[mk][day][fi] && o.pagamentos[mk] && o.pagamentos[mk][day]){
          delete o.pagamentos[mk][day][fi];
        }
        persist();
        content.innerHTML = renderDiarias(key);
        bindTabEvents();
      });
    });
    content.querySelectorAll('[data-action="toggle-paid"]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const day = Number(el.dataset.day);
        const fi = Number(el.dataset.func);
        const mk = o.viewMonth;
        if(!o.pagamentos[mk]) o.pagamentos[mk] = {};
        if(!o.pagamentos[mk][day]) o.pagamentos[mk][day] = {};
        o.pagamentos[mk][day][fi] = !o.pagamentos[mk][day][fi];
        persist();
        content.innerHTML = renderDiarias(key);
        bindTabEvents();
      });
    });
    content.querySelectorAll('[data-action="edit-func"]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        o.funcionarios[Number(inp.dataset.func)] = inp.value;
        persist();
      });
      inp.addEventListener('blur', ()=>{ content.innerHTML = renderDiarias(key); bindTabEvents(); });
    });
    const prev = content.querySelector('[data-action="cal-prev"]');
    const next = content.querySelector('[data-action="cal-next"]');
    if(prev) prev.addEventListener('click', ()=>{ shiftMonth(o,-1); persist(); content.innerHTML = renderDiarias(key); bindTabEvents(); });
    if(next) next.addEventListener('click', ()=>{ shiftMonth(o,1); persist(); content.innerHTML = renderDiarias(key); bindTabEvents(); });

    function contarPendentes(fi){
      const mk = o.viewMonth;
      const diariasMes = o.diarias[mk] || {};
      const pagamentosMes = o.pagamentos[mk] || {};
      let total = 0, pagas = 0;
      Object.keys(diariasMes).forEach(dayStr=>{
        if(diariasMes[dayStr][fi]){
          total++;
          if(pagamentosMes[dayStr] && pagamentosMes[dayStr][fi]) pagas++;
        }
      });
      return total - pagas;
    }

    content.querySelectorAll('.calc-valor-diaria').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const fi = Number(inp.dataset.func);
        o.valorDiaria[fi] = Number(inp.value) || 0;
        persist();
        const pendente = contarPendentes(fi);
        const subtotalEl = content.querySelector(`[data-func-subtotal="${fi}"]`);
        if(subtotalEl) subtotalEl.textContent = fmtBRL(pendente * o.valorDiaria[fi]);
        let totalGeral = 0;
        [0,1,2].forEach(idx=>{ totalGeral += contarPendentes(idx) * (Number(o.valorDiaria[idx])||0); });
        const totalEl = content.querySelector('#calc-total-geral');
        if(totalEl) totalEl.textContent = fmtBRL(totalGeral);
      });
    });

    content.querySelectorAll('[data-action="marcar-pagas"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const fi = Number(btn.dataset.func);
        const mk = o.viewMonth;
        const diariasMes = o.diarias[mk] || {};
        if(!o.pagamentos[mk]) o.pagamentos[mk] = {};
        let diasPagos = 0;
        Object.keys(diariasMes).forEach(dayStr=>{
          if(diariasMes[dayStr][fi]){
            if(!o.pagamentos[mk][dayStr]) o.pagamentos[mk][dayStr] = {};
            if(!o.pagamentos[mk][dayStr][fi]){
              o.pagamentos[mk][dayStr][fi] = true;
              diasPagos++;
            }
          }
        });
        if(diasPagos > 0){
          const valor = diasPagos * (Number(o.valorDiaria[fi])||0);
          if(!o.historicoPagamentos) o.historicoPagamentos = [];
          o.historicoPagamentos.unshift({id: uid(), funcionario: o.funcionarios[fi], mes: mk, dias: diasPagos, valor, data: todayISO});
        }
        persist();
        content.innerHTML = renderDiarias(key);
        bindTabEvents();
      });
    });

    content.querySelectorAll('[data-action="del-historico"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = btn.closest('tr');
        const id = row.dataset.id;
        const idx = (o.historicoPagamentos||[]).findIndex(h=>h.id===id);
        if(idx>-1) o.historicoPagamentos.splice(idx,1);
        persist();
        content.innerHTML = renderDiarias(key);
        bindTabEvents();
      });
    });
  }


  if(tab === 'materiais'){
    if(isEditor) bindListTab(content, o.materiais, 'del-material', renderMateriais, key);
    const fDe = content.querySelector('#filtro-materiais-de');
    const fAte = content.querySelector('#filtro-materiais-ate');
    if(fDe) fDe.addEventListener('change', ()=>{ filtros.materiaisDe = fDe.value; content.innerHTML = renderMateriais(key); bindTabEvents(); });
    if(fAte) fAte.addEventListener('change', ()=>{ filtros.materiaisAte = fAte.value; content.innerHTML = renderMateriais(key); bindTabEvents(); });
    const limparF = content.querySelector('[data-action="limpar-filtro-materiais"]');
    if(limparF) limparF.addEventListener('click', ()=>{ filtros.materiaisDe=''; filtros.materiaisAte=''; content.innerHTML = renderMateriais(key); bindTabEvents(); });
  }
  if(tab === 'locacoes'){
    if(isEditor) bindListTab(content, o.locacoes, 'del-locacao', renderLocacoes, key);
    const lDe = content.querySelector('#filtro-locacoes-de');
    const lAte = content.querySelector('#filtro-locacoes-ate');
    if(lDe) lDe.addEventListener('change', ()=>{ filtros.locacoesDe = lDe.value; content.innerHTML = renderLocacoes(key); bindTabEvents(); });
    if(lAte) lAte.addEventListener('change', ()=>{ filtros.locacoesAte = lAte.value; content.innerHTML = renderLocacoes(key); bindTabEvents(); });
    const limparL = content.querySelector('[data-action="limpar-filtro-locacoes"]');
    if(limparL) limparL.addEventListener('click', ()=>{ filtros.locacoesDe=''; filtros.locacoesAte=''; content.innerHTML = renderLocacoes(key); bindTabEvents(); });
    if(isEditor){
      content.querySelectorAll('[data-action="add-renovacao"]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const row = btn.closest('tr');
          const id = row.dataset.id;
          const item = (o.locacoes||[]).find(i=>i.id===id);
          if(!item) return;
          if(!item.historicoRenovacoes) item.historicoRenovacoes = [];
          item.historicoRenovacoes.push(todayISO);
          persist();
          content.innerHTML = renderLocacoes(key);
          bindTabEvents();
        });
      });
      content.querySelectorAll('[data-action="undo-renovacao"]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const row = btn.closest('tr');
          const id = row.dataset.id;
          const item = (o.locacoes||[]).find(i=>i.id===id);
          if(!item || !item.historicoRenovacoes || !item.historicoRenovacoes.length) return;
          item.historicoRenovacoes.pop();
          persist();
          content.innerHTML = renderLocacoes(key);
          bindTabEvents();
        });
      });
    }
  }
  if(tab === 'inventario'){
    if(isEditor) bindListTab(content, o.inventario, 'del-inventario', renderInventario, key);
  }

  // add buttons for materiais / locacoes / inventario
  const addMaterial = content.querySelector('[data-action="add-material"]');
  if(addMaterial) addMaterial.addEventListener('click', ()=>{
    o.materiais.push({id: uid(), nome:'', fornecedor:'', valor:'', nf:'', nfLink:'', vencimento:'', pago:false});
    persist(); content.innerHTML = renderMateriais(key); bindTabEvents();
  });
  const addListaCompra = content.querySelector('[data-action="add-lista-compra"]');
  if(addListaCompra) addListaCompra.addEventListener('click', ()=>{
    const textarea = content.querySelector('#lista-compra-texto');
    if(!textarea) return;
    const linhas = textarea.value.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    linhas.forEach(nome=>{
      o.materiais.push({id: uid(), nome, fornecedor:'', valor:'', nf:'', nfLink:'', vencimento:'', pago:false});
    });
    if(linhas.length>0){
      persist();
      content.innerHTML = renderMateriais(key);
      bindTabEvents();
    }
  });
  const addLocacao = content.querySelector('[data-action="add-locacao"]');
  if(addLocacao) addLocacao.addEventListener('click', ()=>{
    o.locacoes.push({id: uid(), equipamento:'', fornecedor:'', inicio:'', fim:'', valor:'', nfLink:'', status:'Pendente', historicoRenovacoes:[]});
    persist(); content.innerHTML = renderLocacoes(key); bindTabEvents();
  });
  const addInventario = content.querySelector('[data-action="add-inventario"]');
  if(addInventario) addInventario.addEventListener('click', ()=>{
    o.inventario.push({id: uid(), material:'', quantidade:'', unidade:'', localizacao:'', dataEntrada:'', obs:''});
    persist(); content.innerHTML = renderInventario(key); bindTabEvents();
  });
}

function bindListTab(content, list, delAction, renderFn, key, isMedicao){
  content.querySelectorAll('tbody tr').forEach(row=>{
    const id = row.dataset.id;
    const item = list.find(i=>i.id===id);
    if(!item) return;
    row.querySelectorAll('[data-field]').forEach(field=>{
      const f = field.dataset.field;
      const evt = (field.type === 'checkbox' || field.tagName==='SELECT' || f==='nfLink') ? 'change' : 'input';
      field.addEventListener(evt, ()=>{
        item[f] = field.type === 'checkbox' ? field.checked : field.value;
        persist();
        // Live re-render for fields affecting status/badges without losing focus on text inputs
        if(field.type === 'checkbox' || f==='vencimento' || f==='nfLink' || field.tagName==='SELECT'){
          content.innerHTML = renderFn(key);
          bindTabEvents();
        }
      });
    });
    const delBtn = row.querySelector(`[data-action="${delAction}"]`);
    if(delBtn){
      delBtn.addEventListener('click', ()=>{
        const idx = list.findIndex(i=>i.id===id);
        if(idx>-1) list.splice(idx,1);
        persist();
        content.innerHTML = renderFn(key);
        bindTabEvents();
      });
    }
  });
}

function shiftMonth(o, dir){
  let [y,m] = o.viewMonth.split('-').map(Number);
  m += dir;
  if(m<1){ m=12; y--; }
  if(m>12){ m=1; y++; }
  o.viewMonth = y + '-' + String(m).padStart(2,'0');
}

loadState();
</script>
</body>
